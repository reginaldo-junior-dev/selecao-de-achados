# Docker: PostgreSQL do container (valores do docker-compose)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:selecao_de_achados}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JWT (obrigatorio, vem do docker-compose)
jwt.secret=${JWT_SECRET}

# Admin seed (vem do docker-compose)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
