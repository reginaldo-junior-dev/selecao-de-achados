# Docker: PostgreSQL do container (valores do docker-compose)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:selecao_de_achados}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JWT (vem do docker-compose; fallback para desenvolvimento)
jwt.secret=${JWT_SECRET:chave-docker-desenvolvimento}

# Admin seed (vem do docker-compose)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Supabase (vem do docker-compose; se vazio, upload de imagens nao funciona)
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
