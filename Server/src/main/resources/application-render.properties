# Render: PostgreSQL gerenciado pelo Render
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# URL base do backend (para upload de imagens)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Supabase (service role key para upload de imagens)
supabase.url=${SUPABASE_URL:https://rukwbfzwzwpxqbfgocsj.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# Admin seed (opcional - setar no ambiente do Render se quiser criar admin automaticamente)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# CORS - origens permitidas (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://selecao-de-achados.vercel.app,https://selecaodeachados.com,https://www.selecaodeachados.com}
