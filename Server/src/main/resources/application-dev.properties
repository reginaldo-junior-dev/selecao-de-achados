# Dev: PostgreSQL local (valores do .env ou defaults)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:selecao_de_achados}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Supabase (necessário para o UploadController compilar, mesmo em dev)
supabase.url=http://localhost:8080
supabase.service-role-key=dev-placeholder

# JWT (dev)
jwt.secret=chave-dev-selecao-de-achados-2024

# Admin seed (opcional em dev - usar env vars ou deixar vazio)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
